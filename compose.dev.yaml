services:
  togewire:
    build:
      context: .
      args:
        PROFILE: dev
    container_name: togewire-dev
    restart: unless-stopped
    init: true
    # must own configs/ and data/: your `id -u`:`id -g` if that isn't 1000
    user: "1000:1000"
    # userns_mode: keep-id   # rootless Podman
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7093:7093"
    volumes:
      - ./configs:/app/configs:Z
      - ./data:/app/data:Z
    environment:
      - TZ=UTC
